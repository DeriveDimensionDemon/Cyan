<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>虛擬 3D 骰子</title>
<style>
    * { box-sizing: border-box; }

    :root {
        --bg: #101014;
        --panel: #19191f;
        --text: #f4f4f6;
        --muted: #aaaab5;
        --accent: #8b5cf6;
        --accent2: #a78bfa;
        --die: #f7f7f7;
        --ink: #15151a;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
            radial-gradient(circle at 50% 35%, #25202f 0, #101014 48%, #09090c 100%);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                     "Noto Sans TC", sans-serif;
        overflow-x: hidden;
    }

    .game {
        width: min(92vw, 760px);
        padding: 28px;
        text-align: center;
    }

    h1 {
        margin: 0 0 6px;
        font-size: clamp(24px, 5vw, 38px);
        letter-spacing: .04em;
    }

    .hint {
        margin: 0 0 22px;
        color: var(--muted);
        font-size: 14px;
    }

    .stage {
        min-height: 390px;
        display: grid;
        place-items: center;
        perspective: 900px;
        perspective-origin: 50% 45%;
    }

    .die-wrap {
        width: 190px;
        height: 190px;
        transform-style: preserve-3d;
        transition: transform 1.15s cubic-bezier(.16,.8,.18,1);
        cursor: pointer;
        user-select: none;
        touch-action: manipulation;
    }

    .die-wrap.rolling {
        animation: tumble 1.05s cubic-bezier(.18,.72,.18,1);
    }

    @keyframes tumble {
        0%   { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
        25%  { transform: rotateX(165deg) rotateY(205deg) rotateZ(55deg); }
        55%  { transform: rotateX(355deg) rotateY(470deg) rotateZ(125deg); }
        80%  { transform: rotateX(520deg) rotateY(650deg) rotateZ(190deg); }
        100% { transform: rotateX(720deg) rotateY(900deg) rotateZ(360deg); }
    }

    .die {
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
    }

    .face {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, #ffffff, #dedee5);
        border: 2px solid #c7c7d0;
        border-radius: 24px;
        color: var(--ink);
        font-size: 76px;
        font-weight: 800;
        line-height: 1;
        box-shadow: inset 0 0 18px rgba(0,0,0,.07);
        backface-visibility: hidden;
    }

    .front  { transform: translateZ(95px); }
    .back   { transform: rotateY(180deg) translateZ(95px); }
    .right  { transform: rotateY(90deg) translateZ(95px); }
    .left   { transform: rotateY(-90deg) translateZ(95px); }
    .top    { transform: rotateX(90deg) translateZ(95px); }
    .bottom { transform: rotateX(-90deg) translateZ(95px); }

    .shadow {
        position: absolute;
        width: 220px;
        height: 55px;
        left: 50%;
        top: calc(50% + 125px);
        transform: translateX(-50%);
        background: rgba(0,0,0,.42);
        filter: blur(22px);
        border-radius: 50%;
        pointer-events: none;
    }

    .result {
        margin: 0 auto 18px;
        width: min(100%, 360px);
        padding: 16px 20px;
        border: 1px solid #33333d;
        border-radius: 14px;
        background: rgba(25,25,31,.82);
    }

    .result-label {
        display: block;
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 3px;
    }

    #result {
        font-size: 34px;
        font-weight: 800;
        color: var(--accent2);
    }

    .controls {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
    }

    button {
        min-height: 46px;
        padding: 10px 22px;
        border-radius: 12px;
        border: 1px solid #45404f;
        background: var(--panel);
        color: var(--text);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition: transform .15s, background .15s, border-color .15s;
    }

    button:hover {
        background: #25212e;
        border-color: var(--accent);
    }

    button:active { transform: scale(.97); }

    button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
    }

    button.primary:hover { background: #7c3aed; }

    .status {
        min-height: 22px;
        margin-top: 14px;
        color: var(--muted);
        font-size: 13px;
    }

    @media (prefers-reduced-motion: reduce) {
        .die-wrap { transition: none; }
        .die-wrap.rolling { animation: none; }
    }

    @media (max-width: 480px) {
        .game { padding: 22px 14px; }
        .stage { min-height: 320px; }
        .die-wrap { width: 150px; height: 150px; }
        .front, .back, .right, .left, .top, .bottom {
            transform-origin: center;
        }
        .front  { transform: translateZ(75px); }
        .back   { transform: rotateY(180deg) translateZ(75px); }
        .right  { transform: rotateY(90deg) translateZ(75px); }
        .left   { transform: rotateY(-90deg) translateZ(75px); }
        .top    { transform: rotateX(90deg) translateZ(75px); }
        .bottom { transform: rotateX(-90deg) translateZ(75px); }
        .face { border-radius: 18px; font-size: 60px; }
        .shadow { top: calc(50% + 105px); width: 180px; }
    }
</style>
</head>
<body>
<main class="game">
    <h1>虛擬 3D 骰子</h1>
    <p class="hint">點擊骰子或按空白鍵 / Enter 擲骰</p>

    <section class="stage" aria-label="3D 骰子區域">
        <div class="die-wrap" id="dieWrap" role="button" tabindex="0"
             aria-label="點擊擲骰">
            <div class="die">
                <div class="face front">1</div>
                <div class="face back">6</div>
                <div class="face right">3</div>
                <div class="face left">4</div>
                <div class="face top">2</div>
                <div class="face bottom">5</div>
            </div>
        </div>
        <div class="shadow" aria-hidden="true"></div>
    </section>

    <div class="result" aria-live="polite">
        <span class="result-label">結果</span>
        <span id="result">1</span>
    </div>

    <div class="controls">
        <button class="primary" id="rollBtn" type="button">🎲 擲骰</button>
        <button id="resetBtn" type="button">↺ 重置</button>
    </div>
    <div class="status" id="status">準備好了。</div>
</main>

<script>
(() => {
    const dieWrap = document.getElementById("dieWrap");
    const rollBtn = document.getElementById("rollBtn");
    const resetBtn = document.getElementById("resetBtn");
    const resultEl = document.getElementById("result");
    const statusEl = document.getElementById("status");

    const orientations = {
        1: { x: 0,   y: 0,   z: 0 },
        2: { x: -90, y: 0,   z: 0 },
        3: { x: 0,   y: -90, z: 0 },
        4: { x: 0,   y: 90,  z: 0 },
        5: { x: 90,  y: 0,   z: 0 },
        6: { x: 0,   y: 180, z: 0 }
    };

    let current = 1;
    let rolling = false;

    function showFace(value, withSpin = true) {
        const o = orientations[value];
        const extraX = withSpin ? 720 : 0;
        const extraY = withSpin ? 720 : 0;

        dieWrap.style.transform =
            `rotateX(${o.x + extraX}deg) rotateY(${o.y + extraY}deg) rotateZ(0deg)`;
        resultEl.textContent = String(value);
        current = value;
    }

    function roll() {
        if (rolling) return;

        rolling = true;
        rollBtn.disabled = true;
        statusEl.textContent = "骰子滾動中…";
        dieWrap.classList.remove("rolling");
        void dieWrap.offsetWidth;
        dieWrap.classList.add("rolling");

        const value = Math.floor(Math.random() * 6) + 1;

        setTimeout(() => {
            dieWrap.classList.remove("rolling");
            showFace(value, true);
            statusEl.textContent = `擲出了 ${value}！`;
            rolling = false;
            rollBtn.disabled = false;
        }, 1050);
    }

    function reset() {
        if (rolling) return;
        showFace(1, false);
        statusEl.textContent = "已重置。";
    }

    rollBtn.addEventListener("click", roll);
    resetBtn.addEventListener("click", reset);
    dieWrap.addEventListener("click", roll);

    dieWrap.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            roll();
        }
    });

    document.addEventListener("keydown", (event) => {
        const tag = document.activeElement?.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
        if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            roll();
        }
    });

    showFace(1, false);
})();
</script>
</body>
</html>
