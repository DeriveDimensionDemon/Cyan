<!DOCTYPE html>
<html lang="zh-Hant">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>SHOWUP</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    background: #ffffff;

    color: #000000;

    font-family:
        Arial,
        "Noto Sans TC",
        sans-serif;

    overflow: hidden;
}


body {

    display: flex;

    align-items: center;

    justify-content: center;

}


/* =====================================================
   遊戲本體
   ===================================================== */

#game {

    position: relative;

    width: min(100vw, 1280px);

    aspect-ratio: 16 / 9;

    overflow: hidden;

    background: #000000;

    border: 3px solid #000000;

    box-shadow:
        0 4px 18px rgba(0, 0, 0, 0.28);

    cursor: none;

    user-select: none;

}


/* =====================================================
   Canvas
   ===================================================== */

canvas {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

}


/* =====================================================
   UI
   ===================================================== */

#ui {

    position: absolute;

    top: 14px;

    left: 18px;

    z-index: 20;

    font-size: 18px;

    font-weight: bold;

    color: white;

    text-shadow:
        0 2px 5px #000000,
        0 0 8px #000000;

    pointer-events: none;

}


#levelText {

    margin-right: 22px;

}


/* =====================================================
   GAME OVER / CLEAR
   ===================================================== */

#message {

    position: absolute;

    inset: 0;

    z-index: 30;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    font-size: 48px;

    font-weight: bold;

    color: white;

    text-align: center;

    text-shadow:
        0 3px 8px #000000,
        0 0 15px #000000;

    pointer-events: none;

}


#message small {

    margin-top: 14px;

    font-size: 20px;

}


/* =====================================================
   START
   ===================================================== */

#startButton {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 40;

    padding: 14px 32px;

    border:
        2px solid white;

    background: #111111;

    color: white;

    font-size: 22px;

    font-weight: bold;

    cursor: pointer;

}


#startButton:hover {

    background: white;

    color: black;

}


/* =====================================================
   BONUS
   ===================================================== */

#bonus {

    position: absolute;

    inset: 0;

    z-index: 100;

    display: none;

    background: #000000;

}


#bonus img {

    width: 100%;
    height: 100%;

    object-fit: contain;

    display: block;

}


#bonusTitle {

    position: absolute;

    top: 18px;

    left: 50%;

    transform:
        translateX(-50%);

    font-size: 22px;

    font-weight: bold;

    letter-spacing: 3px;

    color: white;

    text-shadow:
        0 2px 6px #000000;

    z-index: 101;

}

</style>

</head>


<body>


<div id="game">

    <canvas id="canvas"></canvas>


    <div id="ui">

        <span id="levelText">
            LEVEL 1 / 5
        </span>

        <span id="revealText">
            REVEAL 0%
        </span>

    </div>


    <div id="message"></div>


    <button id="startButton">
        START SHOWUP
    </button>


    <div id="bonus">

        <div id="bonusTitle">
            BONUS IMAGE UNLOCKED
        </div>

        <img
            id="bonusImage"
            src="secret/6.jpg"
            alt="Bonus"
        >

    </div>

</div>


<script>


// =====================================================
// DOM
// =====================================================

const game =
    document.getElementById("game");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const levelText =
    document.getElementById("levelText");

const revealText =
    document.getElementById("revealText");

const message =
    document.getElementById("message");

const startButton =
    document.getElementById("startButton");

const bonus =
    document.getElementById("bonus");

const bonusImage =
    document.getElementById("bonusImage");


// =====================================================
// 畫布尺寸
// =====================================================

const WIDTH = 1280;
const HEIGHT = 720;

canvas.width = WIDTH;
canvas.height = HEIGHT;


// =====================================================
// 遊戲設定
// =====================================================

const BRUSH_SIZE = 50;

const BULLET_WIDTH = 190;
const BULLET_HEIGHT = 42;


// =====================================================
// 五個正式關卡
// =====================================================

const levels = [

    // -------------------------------------------------
    // 第一關：蒼
    // -------------------------------------------------

    {

        image: "secret/1.jpg",

        colors: ["cyan"],

        bullets: 10,

        speed: 3.0,

        messages: [

            "♡ 我愛妳",
            "♡ 多留一下嘛",
            "♡ 晚上要做什麼？",
            "♡ 有空嗎？"

        ]

    },


    // -------------------------------------------------
    // 第二關：金
    // -------------------------------------------------

    {

        image: "secret/2.jpg",

        // ★ 金：yellow → orange

        colors: ["orange"],

        bullets: 12,

        speed: 3.3,

        messages: [

            "♡ 要我陪妳？",
            "♡ 晚..晚餐吃了嗎？",
            "♡ 哼！",
            "♡ 知道啦！"

        ]

    },


    // -------------------------------------------------
    // 第三關：紅
    // -------------------------------------------------

    {

        image: "secret/3.jpg",

        colors: ["red"],

        bullets: 14,

        speed: 3.6,

        messages: [

            "♡ 妳被擊中的機率計算中",
            "♡ 嗯？剛剛說什麼？",
            "♡ 別碰那裡...！",
            "♡ 誰設計這款遊戲的？！"

        ]

    },


    // -------------------------------------------------
    // 第四關：白
    // -------------------------------------------------

    {

        image: "secret/4.jpg",

        // ★ 白：白底

        colors: ["white"],

        bullets: 16,

        speed: 3.9,

        // ★ 白：灰字

        textColor: "#696969",

        messages: [

            "♡ 妳有看到蒼嗎？",
            "♡ ．．．",
            "♡ 沒事。",
            "♡ 呃？"

        ]

    },


    // -------------------------------------------------
    // 第五關：四姊妹
    // -------------------------------------------------

    {

        image: "secret/5.jpg",

        colors: [

            "cyan",
            "orange",
            "red",
            "white"

        ],

        bullets: 20,

        speed: 4.3,

        messages: [

            "♡ 我們都在喔",
            "♡ 一起來嘛",
            "♡ 找到妳了",
            "♡ 不要走呀"

        ]

    }

];


// =====================================================
// LEVEL -1
//
// 黑偷偷加碼的隱藏關。
// 注意：這不是第六關。
// GAME OVER 才是隱藏通關。
// =====================================================

const hiddenLevel = {

    image: "secret/5.jpg",

    colors: [

        "#201933"

    ],

    bullets: 42,

    speed: 7.2,

    textColor: "white",

    messages: [

        "⁇ 還要繼續玩嗎？",
        "⁇ 哼哼...",
        "⁇ 已經玩到這兒了呢...",
        "⁇ 不夠滿意嗎？"

    ]

};


// =====================================================
// 遮罩 Canvas
// =====================================================

const maskCanvas =
    document.createElement("canvas");

maskCanvas.width = WIDTH;
maskCanvas.height = HEIGHT;

const mask =
    maskCanvas.getContext("2d");


// =====================================================
// 圖片
// =====================================================

const image =
    new Image();

let imageReady = false;

image.onload = () => {

    imageReady = true;

};

image.onerror = () => {

    message.innerHTML =

        "IMAGE ERROR"

        +

        "<small>"

        +

        "找不到圖片"

        +

        "</small>";

};


// =====================================================
// 滑鼠
// =====================================================

const mouse = {

    x: WIDTH / 2,
    y: HEIGHT / 2

};

const lastMouse = {

    x: WIDTH / 2,
    y: HEIGHT / 2

};

let mouseInside = false;


// =====================================================
// 遊戲狀態
// =====================================================

let currentLevel = 0;

let running = false;

let hiddenMode = false;

let bonusUnlocked = false;

let bullets = [];


// =====================================================
// 滑鼠移動
// =====================================================

game.addEventListener(
    "mousemove",
    event => {

        const rect =
            game.getBoundingClientRect();


        const newX =

            (
                event.clientX -
                rect.left
            )

            /

            rect.width

            *

            WIDTH;


        const newY =

            (
                event.clientY -
                rect.top
            )

            /

            rect.height

            *

            HEIGHT;


        if (running) {

            eraseBetween(

                lastMouse.x,
                lastMouse.y,

                newX,
                newY

            );

        }


        mouse.x = newX;
        mouse.y = newY;

        lastMouse.x = newX;
        lastMouse.y = newY;

        mouseInside = true;

    }
);


game.addEventListener(
    "mouseleave",
    () => {

        mouseInside = false;

    }
);


// =====================================================
// 方形擦除
// =====================================================

function eraseBetween(

    x1,
    y1,
    x2,
    y2

) {

    mask.save();

    mask.globalCompositeOperation =
        "destination-out";

    mask.fillStyle = "#ffffff";


    const dx = x2 - x1;
    const dy = y2 - y1;


    const distance =

        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const step = 4;


    const steps =

        Math.max(
            1,
            Math.ceil(
                distance / step
            )
        );


    for (

        let i = 0;

        i <= steps;

        i++

    ) {

        const t =
            i / steps;


        const x =
            x1 + dx * t;


        const y =
            y1 + dy * t;


        mask.fillRect(

            x - BRUSH_SIZE / 2,
            y - BRUSH_SIZE / 2,

            BRUSH_SIZE,
            BRUSH_SIZE

        );

    }


    mask.restore();

}


// =====================================================
// 重置遮罩
// =====================================================

function resetMask() {

    mask.globalCompositeOperation =
        "source-over";

    mask.fillStyle =
        "#000000";

    mask.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );

}


// =====================================================
// 建立彈幕
// =====================================================

function createBullet() {

    const level =

        hiddenMode
            ? hiddenLevel
            : levels[currentLevel];


    const side =

        Math.floor(
            Math.random() * 4
        );


    let x;
    let y;
    let vx;
    let vy;


    const speed =
        level.speed;


    // 左

    if (side === 0) {

        x = -BULLET_WIDTH;

        y =
            Math.random() * HEIGHT;

        vx = speed;

        vy =

            (
                Math.random() - 0.5
            ) * speed;

    }


    // 右

    else if (side === 1) {

        x = WIDTH;

        y =
            Math.random() * HEIGHT;

        vx = -speed;

        vy =

            (
                Math.random() - 0.5
            ) * speed;

    }


    // 上

    else if (side === 2) {

        x =
            Math.random() * WIDTH;

        y = -BULLET_HEIGHT;

        vx =

            (
                Math.random() - 0.5
            ) * speed;

        vy = speed;

    }


    // 下

    else {

        x =
            Math.random() * WIDTH;

        y = HEIGHT;

        vx =

            (
                Math.random() - 0.5
            ) * speed;

        vy = -speed;

    }


    const color =

        level.colors[

            Math.floor(

                Math.random() *
                level.colors.length

            )

        ];


    const text =

        level.messages[

            Math.floor(

                Math.random() *
                level.messages.length

            )

        ];


    bullets.push({

        x: x,
        y: y,

        vx: vx,
        vy: vy,

        width: BULLET_WIDTH,
        height: BULLET_HEIGHT,

        color: color,

        text: text,

        // ★ 每顆彈幕記錄自己的文字顏色

        textColor:

            color === "white"

                ? "#696969"

                : (
                    level.textColor ||
                    "white"
                )

    });

}


// =====================================================
// 計算揭露率
//
// ★ 已修正 NaN 錯誤
// =====================================================

function calculateReveal() {

    const data =
        mask.getImageData(
            0,
            0,
            WIDTH,
            HEIGHT
        ).data;


    let revealed = 0;

    let total = 0;

    const step = 20;


    for (

        let y = 0;

        y < HEIGHT;

        y += step

    ) {

        for (

            let x = 0;

            x < WIDTH;

            x += step

        ) {

            const index =

                (
                    y * WIDTH +
                    x
                ) * 4;


            total++;


            if (
                data[index + 3] < 30
            ) {

                revealed++;

            }

        }

    }


    // ★ 不要在 return 後換行

    return (
        revealed / total * 100
    );

}


// =====================================================
// 彈幕碰撞
// =====================================================

function checkCollision(bullet) {

    const half =
        BRUSH_SIZE / 2;


    return (

        mouse.x + half >
        bullet.x &&

        mouse.x - half <
        bullet.x +
        bullet.width &&

        mouse.y + half >
        bullet.y &&

        mouse.y - half <
        bullet.y +
        bullet.height

    );

}


// =====================================================
// 載入正常關卡
// =====================================================

function loadLevel(index) {

    hiddenMode = false;

    currentLevel = index;


    const level =
        levels[index];


    levelText.textContent =

        `LEVEL ${
            index + 1
        } / 5`;


    revealText.textContent =
        "REVEAL 0%";


    imageReady = false;

    image.src =
        level.image;


    bullets = [];

    resetMask();


    for (

        let i = 0;

        i < level.bullets;

        i++

    ) {

        createBullet();

    }

}


// =====================================================
// 進入 LEVEL -1
// =====================================================

function enterHiddenLevel() {

    hiddenMode = true;

    running = true;


    levelText.textContent =
        "LEVEL -1 / 5";


    revealText.textContent =
        "REVEAL 0%";


    imageReady = false;

    image.src =
        hiddenLevel.image;


    bullets = [];

    resetMask();


    for (

        let i = 0;

        i < hiddenLevel.bullets;

        i++

    ) {

        createBullet();

    }


    message.innerHTML = "";

}


// =====================================================
// 更新遊戲
// =====================================================

function update() {

    if (!running) {
        return;
    }


    for (

        const bullet of bullets

    ) {

        bullet.x += bullet.vx;

        bullet.y += bullet.vy;


        if (
            checkCollision(bullet)
        ) {

            if (hiddenMode) {

                hiddenGameOver();

            }

            else {

                normalGameOver();

            }

            return;

        }

    }


    bullets =
        bullets.filter(

            bullet =>

                bullet.x >
                -BULLET_WIDTH - 100 &&

                bullet.x <
                WIDTH + 100 &&

                bullet.y >
                -BULLET_HEIGHT - 100 &&

                bullet.y <
                HEIGHT + 100

        );


    const target =

        hiddenMode
            ? hiddenLevel.bullets
            : levels[currentLevel].bullets;


    while (
        bullets.length < target
    ) {

        createBullet();

    }


    const reveal =
        calculateReveal();


    revealText.textContent =

        `REVEAL ${
            Math.floor(reveal)
        }%`;


    // LEVEL -1 故意沒有成功條件

    if (

        !hiddenMode &&

        reveal >= 80

    ) {

        clearLevel();

    }

}


// =====================================================
// 畫彈幕
// =====================================================

function drawBullet(bullet) {

    // -------------------------------------------------
    // 背景
    // -------------------------------------------------

    ctx.fillStyle =
        bullet.color;


    ctx.fillRect(

        bullet.x,
        bullet.y,

        bullet.width,
        bullet.height

    );


    // -------------------------------------------------
    // 文字
    // -------------------------------------------------

    ctx.fillStyle =
        bullet.textColor;


    ctx.font =
        "bold 18px Arial, 'Noto Sans TC', sans-serif";


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.fillText(

        bullet.text,

        bullet.x +
        bullet.width / 2,

        bullet.y +
        bullet.height / 2

    );

}


// =====================================================
// 繪圖
// =====================================================

function draw() {

    ctx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    // -------------------------------------------------
    // 底圖
    // -------------------------------------------------

    if (imageReady) {

        ctx.drawImage(

            image,

            0,
            0,

            WIDTH,
            HEIGHT

        );

    }


    // -------------------------------------------------
    // 遮罩
    // -------------------------------------------------

    ctx.drawImage(
        maskCanvas,
        0,
        0
    );


    // -------------------------------------------------
    // 彈幕
    // -------------------------------------------------

    for (
        const bullet of bullets
    ) {

        drawBullet(bullet);

    }


    // -------------------------------------------------
    // 50 × 50 方形畫筆
    // -------------------------------------------------

    if (
        mouseInside &&
        running
    ) {

        ctx.strokeStyle =
            "white";

        ctx.lineWidth = 2;


        ctx.strokeRect(

            mouse.x -
            BRUSH_SIZE / 2,

            mouse.y -
            BRUSH_SIZE / 2,

            BRUSH_SIZE,
            BRUSH_SIZE

        );

    }

}


// =====================================================
// 一般 GAME OVER
// =====================================================

function normalGameOver() {

    running = false;


    message.innerHTML =

        "HIT!"

        +

        "<small>" +

        "Press R to retry"

        +

        "</small>";

}


// =====================================================
// 正常通關
// =====================================================

function clearLevel() {

    running = false;


    // 第五關通關

    if (
        currentLevel ===
        levels.length - 1
    ) {

        message.innerHTML =

            "LEVEL 5 CLEAR!"

            +

            "<small>...</small>";


        setTimeout(

            () => {

                enterHiddenLevel();

            },

            1500

        );


        return;

    }


    message.innerHTML =

        `LEVEL ${
            currentLevel + 1
        } CLEAR!`;


    setTimeout(

        () => {

            message.innerHTML = "";


            loadLevel(
                currentLevel + 1
            );


            running = true;

        },

        1200

    );

}


// =====================================================
// LEVEL -1 GAME OVER
//
// ★ GAME OVER = 真正通關
// =====================================================

function hiddenGameOver() {

    running = false;

    bonusUnlocked = true;


    message.innerHTML =
        "GAME OVER";


    setTimeout(

        () => {

            message.innerHTML = "";

            showBonus();

        },

        1200

    );

}


// =====================================================
// 顯示 BONUS
// =====================================================

function showBonus() {

    bonus.style.display =
        "block";


    bonusImage.src =
        "secret/6.jpg";

}


// =====================================================
// 關閉 BONUS
// =====================================================

function closeBonus() {

    bonus.style.display =
        "none";


    message.innerHTML =

        "SHOWUP COMPLETE"

        +

        "<small>" +

        "Press B to view bonus again"

        +

        "</small>";

}


// =====================================================
// 開始遊戲
// =====================================================

startButton.addEventListener(

    "click",

    () => {

        startButton.style.display =
            "none";


        bonus.style.display =
            "none";


        message.innerHTML = "";


        bonusUnlocked = false;


        loadLevel(0);


        running = true;

    }

);


// =====================================================
// 鍵盤
// =====================================================

document.addEventListener(

    "keydown",

    event => {

        const key =
            event.key.toLowerCase();


        // -------------------------------------------------
        // R：重新開始目前關卡
        // -------------------------------------------------

        if (

            key === "r" &&

            !bonusUnlocked

        ) {

            if (!running) {

                message.innerHTML = "";


                if (hiddenMode) {

                    enterHiddenLevel();

                }

                else {

                    loadLevel(
                        currentLevel
                    );

                    running = true;

                }

            }

        }


        // -------------------------------------------------
        // B：重新觀看 BONUS
        // -------------------------------------------------

        if (

            key === "b" &&

            bonusUnlocked

        ) {

            showBonus();

        }


        // -------------------------------------------------
        // ESC：離開 BONUS
        // -------------------------------------------------

        if (

            key === "escape" &&

            bonusUnlocked

        ) {

            closeBonus();

        }

    }

);


// =====================================================
// 初始化
// =====================================================

resetMask();


// =====================================================
// 主迴圈
// =====================================================

function loop() {

    update();

    draw();

    requestAnimationFrame(loop);

}


loop();

</script>

</body>

</html>
