<style>

/* =====================================================
   基本設定
   ===================================================== */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    height: 100%;

    color: #000000;

    font-family:

   ===================================================== */

   ===================================================== */

canvas {

   ===================================================== */

#startTitle {

#startNote {

#startButton {

}

}

#bonus {

    z-index: 100;

    background: #000000;

}


#bonus img {

}


#bonusTitle {

}


/* =====================================================
   Gallery
   ===================================================== */

#gallery {

    position: absolute;

    inset: 0;

    z-index: 200;

    display: none;

    background: #111111;

    color: white;

}


#galleryHeader {

#galleryGrid {

}


.galleryThumb {

}


.galleryThumb:hover {

}


.galleryThumb img {

.galleryNumber {

/* =====================================================

#galleryViewer {

}

}


#galleryCounter {

.galleryNav {

#galleryPrev {

#galleryClose {

#galleryClose:hover {

}


/* =====================================================

#galleryFooter {

}


.galleryButton {

/* =====================================================

#finalScreen {

<script>


// =====================================================
// DOM
// =====================================================

const game =
    document.getElementById("game");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const levelText =
    document.getElementById("levelText");

const revealText =
    document.getElementById("revealText");

const message =
    document.getElementById("message");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const bonus =
    document.getElementById("bonus");

const bonusImage =
    document.getElementById("bonusImage");

const gallery =
    document.getElementById("gallery");

const galleryGrid =
    document.getElementById("galleryGrid");

const galleryViewer =
    document.getElementById("galleryViewer");

const galleryImage =
    document.getElementById("galleryImage");

const galleryCounter =
    document.getElementById("galleryCounter");

const galleryPrev =
    document.getElementById("galleryPrev");

const galleryNext =
    document.getElementById("galleryNext");

const galleryClose =
    document.getElementById("galleryClose");

const galleryBack =
    document.getElementById("galleryBack");

const finalScreen =
    document.getElementById("finalScreen");

const openGalleryButton =
    document.getElementById("openGalleryButton");


// =====================================================
// Canvas
// =====================================================

const WIDTH = 1280;
const HEIGHT = 720;

canvas.width = WIDTH;
canvas.height = HEIGHT;


// =====================================================
// 遊戲設定
// =====================================================

const BRUSH_SIZE = 50;

const BULLET_WIDTH = 190;

const BULLET_HEIGHT = 42;


// =====================================================
// ★★★★★ CHEAT MODE ★★★★★
//
// SHIFT 無敵
//
// 按住 SHIFT：
// 彈幕碰撞無效。
//
// 若正式發布時想移除作弊功能，
// 主要刪除此區塊，並刪除
// checkCollision() 中的 shiftInvincible 判定。
// =====================================================

let shiftInvincible = false;


document.addEventListener(
    "keydown",
    event => {

        if (event.key === "Shift") {

            shiftInvincible = true;

        }

    }
);


document.addEventListener(
    "keyup",
    event => {

        if (event.key === "Shift") {

            shiftInvincible = false;

        }

    }
);


// =====================================================
// 正式關卡
// =====================================================

const levels = [

    // 第一關：蒼

    {

        image: "secret/1.jpg",

        colors: ["cyan"],

        bullets: 10,

        speed: 3.0,

        messages: [

            "♡ 我愛妳",
            "♡ 多留一下嘛",
            "♡ 晚上要做什麼？",
            "♡ 有空嗎？"

        ]

    },


    // 第二關：金

    {

        image: "secret/2.jpg",

        colors: ["orange"],

        bullets: 12,

        speed: 3.3,

        messages: [

            "♡ 要我陪妳？",
            "♡ 晚..晚餐吃了嗎？",
            "♡ 哼！",
            "♡ 知道啦！"

        ]

    },


    // 第三關：紅

    {

        image: "secret/3.jpg",

        colors: ["red"],

        bullets: 14,

        speed: 3.6,

        messages: [

            "♡ 妳被擊中的機率計算中",
            "♡ 嗯？剛剛說什麼？",
            "♡ 別碰那裡...！",
            "♡ 誰設計這款遊戲的？！"

        ]

    },


    // 第四關：白

    {

        image: "secret/4.jpg",

        colors: ["white"],

        bullets: 16,

        speed: 3.9,

        textColor: "#696969",

        messages: [

            "♡ 妳有看到蒼嗎？",
            "♡ ．．．",
            "♡ 沒事。",
            "♡ 呃？"

        ]

    },


    // 第五關：四姊妹

    {

        image: "secret/5.jpg",

        colors: [

            "cyan",
            "orange",
            "red",
            "white"

        ],

        bullets: 20,

        speed: 4.3,

        messages: [

            "♡ 我們都在喔",
            "♡ 一起來嘛",
            "♡ 找到妳了",
            "♡ 不要走呀"

        ]

    }

];


// =====================================================
// LEVEL -1
//
// 黑偷偷加碼的隱藏關。
// =====================================================

const hiddenLevel = {

    image: "secret/5.jpg",

    colors: [

        "#201933"

    ],

    bullets: 42,

    speed: 7.2,

    textColor: "white",

    messages: [

        "⁇ 還要繼續玩嗎？",
        "⁇ 哼哼...",
        "⁇ 已經玩到這兒了呢...",
        "⁇ 不夠滿意嗎？"

    ]

};


// =====================================================
// Mask Canvas
// =====================================================

const maskCanvas =
    document.createElement("canvas");

maskCanvas.width = WIDTH;

maskCanvas.height = HEIGHT;

const mask =
    maskCanvas.getContext("2d");


// =====================================================
// 圖片
// =====================================================

const image =
    new Image();

let imageReady = false;


image.onload = () => {

    imageReady = true;

};


image.onerror = () => {

    message.innerHTML =

        "IMAGE ERROR"

        +

        "<small>"

        +

        "找不到圖片"

        +

        "</small>";

};


// =====================================================
// 滑鼠
// =====================================================

const mouse = {

    x: WIDTH / 2,

    y: HEIGHT / 2

};


const lastMouse = {

    x: WIDTH / 2,

    y: HEIGHT / 2

};


let mouseInside = false;


// =====================================================
// 遊戲狀態
// =====================================================

let currentLevel = 0;

let running = false;

let hiddenMode = false;

let bonusUnlocked = false;

let bullets = [];


// =====================================================
// Gallery 狀態
// =====================================================

const galleryImages = [

    "secret/1.jpg",
    "secret/2.jpg",
    "secret/3.jpg",
    "secret/4.jpg",
    "secret/5.jpg",
    "secret/6.jpg"

];

let galleryIndex = 0;


// =====================================================
// 滑鼠移動
// =====================================================

game.addEventListener(
    "mousemove",
    event => {

        const rect =
            game.getBoundingClientRect();


        const newX =

            (
                event.clientX -
                rect.left
            )

            /

            rect.width

            *

            WIDTH;


        const newY =

            (
                event.clientY -
                rect.top
            )

            /

            rect.height

            *

            HEIGHT;


        if (running) {

            eraseBetween(

                lastMouse.x,
                lastMouse.y,

                newX,
                newY

            );

        }


        mouse.x = newX;

        mouse.y = newY;

        lastMouse.x = newX;

        lastMouse.y = newY;

        mouseInside = true;

    }
);


game.addEventListener(
    "mouseleave",
    () => {

        mouseInside = false;

    }
);


// =====================================================
// ★ R 或滑鼠左鍵重新開始
// =====================================================

function retryLevel() {

    if (bonusUnlocked) {

        return;

    }


    if (running) {

        return;

    }


    message.innerHTML = "";


    if (hiddenMode) {

        enterHiddenLevel();

    }

    else {

        loadLevel(currentLevel);

        running = true;

    }

}


// =====================================================
// 滑鼠左鍵
// =====================================================

game.addEventListener(
    "mousedown",
    event => {

        if (event.button === 0) {

            retryLevel();

        }

    }
);


// =====================================================
// 方形擦除
// =====================================================

function eraseBetween(

    x1,
    y1,
    x2,
    y2

) {

    mask.save();

    mask.globalCompositeOperation =
        "destination-out";

    mask.fillStyle = "#ffffff";


    const dx = x2 - x1;

    const dy = y2 - y1;


    const distance =

        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const step = 4;


    const steps =

        Math.max(
            1,
            Math.ceil(
                distance / step
            )
        );


    for (

        let i = 0;

        i <= steps;

        i++

    ) {

        const t =
            i / steps;


        const x =
            x1 + dx * t;


        const y =
            y1 + dy * t;


        mask.fillRect(

            x - BRUSH_SIZE / 2,
            y - BRUSH_SIZE / 2,

            BRUSH_SIZE,
            BRUSH_SIZE

        );

    }


    mask.restore();

}


// =====================================================
// 重置遮罩
// =====================================================

function resetMask() {

    mask.globalCompositeOperation =
        "source-over";

    mask.fillStyle =
        "#000000";

    mask.fillRect(

        0,
        0,
        WIDTH,
        HEIGHT

    );

}


// =====================================================
// 建立彈幕
// =====================================================

function createBullet() {

    const level =

        hiddenMode
            ? hiddenLevel
            : levels[currentLevel];


    const side =

        Math.floor(
            Math.random() * 4
        );


    let x;
    let y;
    let vx;
    let vy;


    const speed =
        level.speed;


    if (side === 0) {

        x = -BULLET_WIDTH;

        y =
            Math.random() * HEIGHT;

        vx = speed;

        vy =

            (
                Math.random() - 0.5
            ) * speed;

    }


    else if (side === 1) {

        x = WIDTH;

        y =
            Math.random() * HEIGHT;

        vx = -speed;

        vy =

            (
                Math.random() - 0.5
            ) * speed;

    }


    else if (side === 2) {

        x =
            Math.random() * WIDTH;

        y = -BULLET_HEIGHT;

        vx =

            (
                Math.random() - 0.5
            ) * speed;

        vy = speed;

    }


    else {

        x =
            Math.random() * WIDTH;

        y = HEIGHT;

        vx =

            (
                Math.random() - 0.5
            ) * speed;

        vy = -speed;

    }


    const color =

        level.colors[

            Math.floor(

                Math.random() *
                level.colors.length

            )

        ];


    const text =

        level.messages[

            Math.floor(

                Math.random() *
                level.messages.length

            )

        ];


    bullets.push({

        x: x,

        y: y,

        vx: vx,

        vy: vy,

        width: BULLET_WIDTH,

        height: BULLET_HEIGHT,

        color: color,

        text: text,

        textColor:

            color === "white"

                ? "#696969"

                : (

                    level.textColor ||
                    "white"

                )

    });

}


// =====================================================
// 計算揭露率
// =====================================================

function calculateReveal() {

    const data =
        mask.getImageData(

            0,
            0,
            WIDTH,
            HEIGHT

        ).data;


    let revealed = 0;

    let total = 0;

    const step = 20;


    for (

        let y = 0;

        y < HEIGHT;

        y += step

    ) {

        for (

            let x = 0;

            x < WIDTH;

            x += step

        ) {

            const index =

                (
                    y * WIDTH +
                    x
                ) * 4;


            total++;


            if (
                data[index + 3] < 30
            ) {

                revealed++;

            }

        }

    }


    return (
        revealed / total * 100
    );

}


// =====================================================
// 碰撞
// =====================================================

function checkCollision(bullet) {


    // =================================================
    // ★ SHIFT 無敵
    //
    // 想刪掉作弊功能時：
    // 刪掉這個 if 區塊即可。
    // =================================================

    if (shiftInvincible) {

        return false;

    }


    const half =
        BRUSH_SIZE / 2;


    return (

        mouse.x + half >
        bullet.x &&

        mouse.x - half <
        bullet.x +
        bullet.width &&

        mouse.y + half >
        bullet.y &&

        mouse.y - half <
        bullet.y +
        bullet.height

    );

}


// =====================================================
// 載入正式關卡
// =====================================================

function loadLevel(index) {

    hiddenMode = false;

    currentLevel = index;


    const level =
        levels[index];


    levelText.textContent =

        `LEVEL ${
            index + 1
        } / 5`;


    revealText.textContent =
        "REVEAL 0%";


    imageReady = false;

    image.src =
        level.image;


    bullets = [];

    resetMask();


    for (

        let i = 0;

        i < level.bullets;

        i++

    ) {

        createBullet();

    }

}


// =====================================================
// LEVEL -1
// =====================================================

function enterHiddenLevel() {

    hiddenMode = true;

    running = true;


    levelText.textContent =
        "LEVEL -1 / 5";


    revealText.textContent =
        "REVEAL 0%";


    imageReady = false;

    image.src =
        hiddenLevel.image;


    bullets = [];

    resetMask();


    for (

        let i = 0;

        i < hiddenLevel.bullets;

        i++

    ) {

        createBullet();

    }


    message.innerHTML = "";

}


// =====================================================
// 更新
// =====================================================

function update() {

    if (!running) {

        return;

    }


    for (

        const bullet of bullets

    ) {

        bullet.x += bullet.vx;

        bullet.y += bullet.vy;


        if (
            checkCollision(bullet)
        ) {

            if (hiddenMode) {

                hiddenGameOver();

            }

            else {

                normalGameOver();

            }

            return;

        }

    }


    bullets =
        bullets.filter(

            bullet =>

                bullet.x >
                -BULLET_WIDTH - 100 &&

                bullet.x <
                WIDTH + 100 &&

                bullet.y >
                -BULLET_HEIGHT - 100 &&

                bullet.y <
                HEIGHT + 100

        );


    const target =

        hiddenMode

            ? hiddenLevel.bullets

            : levels[currentLevel].bullets;


    while (
        bullets.length < target
    ) {

        createBullet();

    }


    const reveal =
        calculateReveal();


    revealText.textContent =

        `REVEAL ${
            Math.floor(reveal)
        }%`;


    // 正式關卡：
    // 超過 80% 才進下一關

    if (

        !hiddenMode &&

        reveal > 80

    ) {

        clearLevel();

    }

}


// =====================================================
// 畫彈幕
// =====================================================

function drawBullet(bullet) {

    ctx.fillStyle =
        bullet.color;


    ctx.fillRect(

        bullet.x,
        bullet.y,

        bullet.width,
        bullet.height

    );


    ctx.fillStyle =
        bullet.textColor;


    ctx.font =
        "bold 18px Arial, 'Noto Sans TC', sans-serif";


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.fillText(

        bullet.text,

        bullet.x +
        bullet.width / 2,

        bullet.y +
        bullet.height / 2

    );

}


// =====================================================
// 繪圖
// =====================================================

function draw() {

    ctx.clearRect(

        0,
        0,
        WIDTH,
        HEIGHT

    );


    if (imageReady) {

        ctx.drawImage(

            image,

            0,
            0,

            WIDTH,
            HEIGHT

        );

    }


    ctx.drawImage(

        maskCanvas,

        0,
        0

    );


    for (
        const bullet of bullets
    ) {

        drawBullet(bullet);

    }


    if (

        mouseInside &&

        running

    ) {

        ctx.strokeStyle =
            "white";

        ctx.lineWidth = 2;


        ctx.strokeRect(

            mouse.x -
            BRUSH_SIZE / 2,

            mouse.y -
            BRUSH_SIZE / 2,

            BRUSH_SIZE,
            BRUSH_SIZE

        );

    }

}


// =====================================================
// 一般 GAME OVER
// =====================================================

function normalGameOver() {

    running = false;


    message.innerHTML =

        "HIT!"

        +

        "<small>"

        +

        "Press R or click to retry"

        +

        "</small>";

}


// =====================================================
// 正常通關
// =====================================================

function clearLevel() {

    running = false;


    if (

        currentLevel ===
        levels.length - 1

    ) {

        message.innerHTML =

            "LEVEL 5 CLEAR!"

            +

            "<small>...</small>";


        setTimeout(

            () => {

                enterHiddenLevel();

            },

            1500

        );


        return;

    }


    message.innerHTML =

        `LEVEL ${
            currentLevel + 1
        } CLEAR!`;


    setTimeout(

        () => {

            message.innerHTML = "";

            loadLevel(
                currentLevel + 1
            );

            running = true;

        },

        1200

    );

}


// =====================================================
// LEVEL -1 GAME OVER
//
// GAME OVER = 真正通關
// =====================================================

function hiddenGameOver() {

    running = false;

    bonusUnlocked = true;


    message.innerHTML =
        "GAME OVER";


    setTimeout(

        () => {

            message.innerHTML = "";

            showBonus();

        },

        1200

    );

}


// =====================================================
// 顯示第六張 BONUS
// =====================================================

function showBonus() {

    bonus.style.display =
        "block";


    bonusImage.src =
        "secret/6.jpg";

}


// =====================================================
// 建立 Gallery
// =====================================================

function buildGallery() {

    galleryGrid.innerHTML = "";


    galleryImages.forEach(

        (src, index) => {

            const item =
                document.createElement("div");


            item.className =
                "galleryThumb";


            const img =
                document.createElement("img");


            img.src = src;

            img.alt =
                `Gallery ${index + 1}`;


            const number =
                document.createElement("div");


            number.className =
                "galleryNumber";


            number.textContent =
                `${index + 1}`;


            item.appendChild(img);

            item.appendChild(number);


            item.addEventListener(

                "click",

                () => {

                    openGalleryImage(index);

                }

            );


            galleryGrid.appendChild(item);

        }

    );

}


// =====================================================
// 打開 Gallery
// =====================================================

function openGallery() {

    if (!bonusUnlocked) {

        return;

    }


    bonus.style.display =
        "none";


    finalScreen.style.display =
        "none";


    gallery.style.display =
        "block";


    galleryViewer.style.display =
        "none";


    buildGallery();

}


// =====================================================
// 關閉 Gallery
// =====================================================

function closeGallery() {

    gallery.style.display =
        "none";


    galleryViewer.style.display =
        "none";


    finalScreen.style.display =
        "flex";

}


// =====================================================
// Gallery 看大圖
// =====================================================

function openGalleryImage(index) {

    galleryIndex = index;


    galleryViewer.style.display =
        "block";


    updateGalleryImage();

}


// =====================================================
// Gallery 圖片更新
// =====================================================

function updateGalleryImage() {

    galleryImage.src =
        galleryImages[galleryIndex];


    galleryCounter.textContent =

        `${galleryIndex + 1} / ${
            galleryImages.length
        }`;

}


// =====================================================
// Gallery 上一張
// =====================================================

function previousGalleryImage() {

    galleryIndex--;


    if (
        galleryIndex < 0
    ) {

        galleryIndex =
            galleryImages.length - 1;

    }


    updateGalleryImage();

}


// =====================================================
// Gallery 下一張
// =====================================================

function nextGalleryImage() {

    galleryIndex++;


    if (

        galleryIndex >=
        galleryImages.length

    ) {

        galleryIndex = 0;

    }


    updateGalleryImage();

}


// =====================================================
// 關閉 Gallery 大圖
// =====================================================

function closeGalleryViewer() {

    galleryViewer.style.display =
        "none";

}


// =====================================================
// 最終破關畫面
// =====================================================

function showFinalScreen() {

    bonus.style.display =
        "none";


    gallery.style.display =
        "none";


    galleryViewer.style.display =
        "none";


    finalScreen.style.display =
        "flex";

}


// =====================================================
// 開始遊戲
// =====================================================

startButton.addEventListener(

    "click",

    () => {

        startScreen.style.display =
            "none";


        bonus.style.display =
            "none";


        gallery.style.display =
            "none";


        finalScreen.style.display =
            "none";


        message.innerHTML = "";


        bonusUnlocked = false;


        loadLevel(0);


        running = true;

    }

);


// =====================================================
// BONUS 圖片點擊
//
// 點 BONUS 圖片 → 進入完整 Gallery
// =====================================================

bonus.addEventListener(

    "click",

    () => {

        openGallery();

    }

);


// =====================================================
// Gallery 按鈕
// =====================================================

openGalleryButton.addEventListener(

    "click",

    () => {

        openGallery();

    }

);


galleryClose.addEventListener(

    "click",

    () => {

        closeGallery();

    }

);


galleryBack.addEventListener(

    "click",

    () => {

        closeGalleryViewer();

    }

);


galleryPrev.addEventListener(

    "click",

    () => {

        previousGalleryImage();

    }

);


galleryNext.addEventListener(

    "click",

    () => {

        nextGalleryImage();

    }

);


// =====================================================
// 鍵盤
// =====================================================

document.addEventListener(

    "keydown",

    event => {

        const key =
            event.key.toLowerCase();


        // ---------------------------------------------
        // R：重試
        // ---------------------------------------------

        if (key === "r") {

            retryLevel();

        }


        // ---------------------------------------------
        // B：打開 Gallery
        // ---------------------------------------------

        if (

            key === "b" &&

            bonusUnlocked

        ) {

            openGallery();

        }


        // ---------------------------------------------
        // ESC
        // ---------------------------------------------

        if (
            key === "escape"
        ) {


            // 大圖 → Gallery

            if (

                galleryViewer.style.display ===
                "block"

            ) {

                closeGalleryViewer();

                return;

            }


            // Gallery → 最終畫面

            if (

                gallery.style.display ===
                "block"

            ) {

                closeGallery();

                return;

            }


            // BONUS → Gallery

            if (

                bonus.style.display ===
                "block"

            ) {

                openGallery();

                return;

            }

        }


        // ---------------------------------------------
        // Gallery 左右鍵
        // ---------------------------------------------

        if (

            galleryViewer.style.display ===
            "block"

        ) {

            if (event.key === "ArrowLeft") {

                previousGalleryImage();

            }


            if (event.key === "ArrowRight") {

                nextGalleryImage();

            }

        }

    }

);


// =====================================================
// 初始化
// =====================================================

resetMask();


// =====================================================
// 主迴圈
// =====================================================

function loop() {

    update();

    draw();

    requestAnimationFrame(loop);

}


loop();

</script>

</body>

</html>
